<!doctype html>
<!--
	Source of static/og.png, the link-preview image (og:image). 1200×630.
	Regenerate with `pnpm og` after changing this file or the profile copy it mirrors
	(PROFILE and SYSTEM in src/lib/data/content.ts). Colours are the green theme's
	tokens from src/app.css.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Martian+Mono:wght@400;800&display=block"
			rel="stylesheet"
		/>
		<style>
			:root {
				--phos: #4ade80;
				--phos-hot: #d5ffe6;
				--bar: #1ee07c;
				--on-bar: #04170c;
				--mark: #ff5f45;
				--mark-fringe: rgba(120, 220, 255, 0.28);
				--bg: #000000;
				--phos-mid: color-mix(in srgb, var(--phos) 62%, transparent);
				--phos-dim: color-mix(in srgb, var(--phos) 40%, transparent);
				--rule: color-mix(in srgb, var(--phos) 26%, transparent);
				--glow:
					0 0 4px color-mix(in srgb, var(--phos) 55%, transparent),
					0 0 16px color-mix(in srgb, var(--phos) 18%, transparent);
				--mono: 'Geist Mono', monospace;
				--display: 'Martian Mono', var(--mono);
			}

			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				background: #050805;
				overflow: hidden;
			}

			/* the tube: rounded glass inside a dark bezel */
			.tube {
				position: absolute;
				inset: 18px;
				border-radius: 28px;
				background: radial-gradient(ellipse at 50% 45%, #041008 0%, var(--bg) 70%);
				box-shadow:
					inset 0 0 0 1px var(--rule),
					inset 0 0 90px rgba(0, 0, 0, 0.9);
				overflow: hidden;
				font-family: var(--mono);
				color: var(--phos);
				text-shadow: var(--glow);
			}

			.screen {
				position: absolute;
				inset: 38px 48px 34px;
				display: grid;
				grid-template-rows: auto 1fr auto;
				gap: 22px;
			}

			.top {
				display: flex;
				justify-content: space-between;
				padding-bottom: 14px;
				border-bottom: 1px solid var(--rule);
				font-size: 19px;
				letter-spacing: 0.08em;
			}

			.dim {
				color: var(--phos-dim);
			}

			.mid {
				display: grid;
				grid-template-columns: 1fr 268px;
				gap: 44px;
				align-items: center;
			}

			.mark {
				position: relative;
				padding-top: 34px;
			}

			.mark__over {
				position: absolute;
				top: 0;
				left: 6px;
				font-family: var(--display);
				font-size: 20px;
				letter-spacing: 0.36em;
				color: rgba(190, 200, 195, 0.55);
				text-shadow: none;
			}

			.mark__name {
				position: relative;
				display: block;
				font-family: var(--display);
				font-weight: 800;
				font-size: 116px;
				line-height: 0.9;
				letter-spacing: -0.02em;
				color: var(--mark);
				text-shadow:
					0 0 22px color-mix(in srgb, var(--mark) 45%, transparent),
					4px 0 0 color-mix(in srgb, var(--mark) 35%, transparent);
			}

			.mark__name::before {
				content: attr(data-text);
				position: absolute;
				inset: 0;
				color: var(--mark-fringe);
				translate: -4px 0;
				mix-blend-mode: screen;
			}

			.role {
				margin-top: 30px;
				font-size: 36px;
				font-weight: 500;
				letter-spacing: 0.04em;
				color: var(--phos-hot);
			}

			.cursor {
				display: inline-block;
				width: 0.6em;
				height: 0.95em;
				margin-left: 0.2em;
				vertical-align: -0.12em;
				background: var(--phos);
				box-shadow: var(--glow);
			}

			.tags {
				margin-top: 16px;
				font-size: 21px;
				letter-spacing: 0.12em;
				color: var(--phos-mid);
			}

			.portrait {
				display: grid;
				gap: 10px;
			}

			.portrait__tube {
				position: relative;
				aspect-ratio: 1;
				border: 1px solid var(--rule);
				background: var(--bg);
				overflow: hidden;
			}

			.portrait__tube img {
				display: block;
				width: 100%;
				height: 100%;
				filter: grayscale(1) contrast(1.35) brightness(1.25);
			}

			.portrait__tube::after {
				content: '';
				position: absolute;
				inset: 0;
				background: var(--phos);
				mix-blend-mode: multiply;
			}

			.label {
				font-size: 15px;
				letter-spacing: 0.2em;
			}

			.bar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 12px 18px;
				background: var(--bar);
				color: var(--on-bar);
				text-shadow: none;
				box-shadow: 0 0 22px color-mix(in srgb, var(--bar) 45%, transparent);
				font-size: 26px;
				font-weight: 700;
				letter-spacing: 0.08em;
			}

			.bar small {
				font-size: 19px;
				font-weight: 500;
				letter-spacing: 0.14em;
			}

			/* scanlines, then the vignette the curved glass throws */
			.tube::before,
			.tube::after {
				content: '';
				position: absolute;
				inset: 0;
				pointer-events: none;
				z-index: 1;
			}

			.tube::before {
				background: repeating-linear-gradient(
					to bottom,
					rgba(0, 0, 0, 0) 0 2px,
					rgba(0, 0, 0, 0.32) 2px 4px
				);
			}

			.tube::after {
				background: radial-gradient(
					ellipse at 50% 50%,
					rgba(0, 0, 0, 0) 58%,
					rgba(0, 0, 0, 0.55) 100%
				);
			}
		</style>
	</head>
	<body>
		<div class="tube">
			<div class="screen">
				<div class="top">
					<span>RK/OS 9000 // MALANG UTC+7 // LINK ACTIVE</span>
					<span class="dim">MANIFEST 001</span>
				</div>

				<div class="mid">
					<div>
						<div class="mark">
							<span class="mark__over">PERSONAL</span>
							<span class="mark__name" data-text="RITSUKI">RITSUKI</span>
						</div>
						<p class="role">&gt; FULL STACK DEVELOPER<span class="cursor"></span></p>
						<p class="tags">BACKEND · INFRASTRUCTURE · SELF-HOSTED</p>
					</div>

					<figure class="portrait">
						<div class="portrait__tube">
							<img src="../src/lib/assets/portrait.webp" alt="" />
						</div>
						<figcaption class="label dim">OPERATOR IMAGE</figcaption>
					</figure>
				</div>

				<div class="bar">
					<span>RITSUKI.DEV</span>
					<small>STATUS: OPEN FOR CONTRACT</small>
				</div>
			</div>
		</div>
	</body>
</html>
